syntax = "proto3";

package flwr.proto;

option java_package = "flwr.android_client";
option java_multiple_files = true;

// -------------------------------------------------------------------------
// Transport
// -------------------------------------------------------------------------

service FlowerService {
    rpc Join(stream ClientMessage) returns (stream ServerMessage) {}
}

// -------------------------------------------------------------------------
// ServerMessage
// -------------------------------------------------------------------------

message ServerMessage {
    oneof msg {
        ReconnectIns reconnect_ins = 1;
        GetPropertiesIns get_properties_ins = 2;
        GetParametersIns get_parameters_ins = 3;
        FitIns fit_ins = 4;
        EvaluateIns evaluate_ins = 5;
    }
}

message ReconnectIns {
    int64 seconds = 1;
}

message GetPropertiesIns {
    map<string, Scalar> config = 1;
}

message GetParametersIns {
    map<string, Scalar> config = 1;
}

message FitIns {
    Parameters parameters = 1;
    map<string, Scalar> config = 2;
}

message EvaluateIns {
    Parameters parameters = 1;
    map<string, Scalar> config = 2;
}

// -------------------------------------------------------------------------
// ClientMessage
// -------------------------------------------------------------------------

message ClientMessage {
    oneof msg {
        DisconnectRes disconnect_res = 1;
        GetPropertiesRes get_properties_res = 2;
        GetParametersRes get_parameters_res = 3;
        FitRes fit_res = 4;
        EvaluateRes evaluate_res = 5;
    }
}

// El servidor declara `reason` como enum, no como string. Enviar un string
// aquí no rompía nada visible —protobuf descarta el campo por desajuste de
// wire type y lo trata como desconocido— pero el motivo de desconexión nunca
// llegaba al servidor.
enum Reason {
    UNKNOWN = 0;
    RECONNECT = 1;
    POWER_DISCONNECTED = 2;
    WIFI_UNAVAILABLE = 3;
    ACK = 4;
}

message DisconnectRes {
    Reason reason = 1;
}

message GetPropertiesRes {
    Status status = 1;
    map<string, Scalar> properties = 2;
}

message GetParametersRes {
    Status status = 1;
    Parameters parameters = 2;
}

message FitRes {
    Status status = 1;
    Parameters parameters = 2;
    int64 num_examples = 3;
    map<string, Scalar> metrics = 4;
}

message EvaluateRes {
    Status status = 1;
    float loss = 2;
    int64 num_examples = 3;
    map<string, Scalar> metrics = 4;
}

// -------------------------------------------------------------------------
// Common
// -------------------------------------------------------------------------

message Parameters {
    repeated bytes tensors = 1;
    string tensor_type = 2;
}

message Status {
    enum Code {
        OK = 0;
        GET_PROPERTIES_NOT_IMPLEMENTED = 1;
        GET_PARAMETERS_NOT_IMPLEMENTED = 2;
        FIT_NOT_IMPLEMENTED = 3;
        EVALUATE_NOT_IMPLEMENTED = 4;
    }
    Code code = 1;
    string message = 2;
}

// Los NÚMEROS DE CAMPO y los TIPOS deben coincidir exactamente con
// flwr/proto/transport.proto del servidor (flwr 1.23.0). No son correlativos
// a propósito: Flower dejó huecos al eliminar campos antiguos.
//
// Esta declaración tenía `int64 sint64 = 2`, y ese desajuste dejó la
// federación entera sin entrenar durante 18 rondas sin un solo error:
//   · El servidor emite `local_epochs` como sint64 (zigzag) en el campo 8.
//   · El cliente leía el campo 2 como int64, así que el valor caía en los
//     campos desconocidos y el `oneof` quedaba SIN ASIGNAR.
//   · `Scalar.getSint64()` de proto3 devuelve 0 —no null— cuando el `oneof`
//     apunta a otra cosa, de modo que el `?:` de FlowerGrpcClient nunca caía
//     al valor del manifiesto: `local_epochs` valía 0.
//   · `for (epoch in 1..0)` no itera. El encoder volvía al servidor idéntico
//     al que había llegado, con loss=0.0, y FedAvg promediaba 18 copias del
//     mismo vector.
// `double` estaba en el campo 1 en ambos lados, y por eso `lr` sí llegaba
// bien: era el único valor de configuración que el cliente leía de verdad.
message Scalar {
    oneof scalar {
        double double = 1;
        uint64 uint64 = 6;
        sint64 sint64 = 8;
        bool bool = 13;
        string string = 14;
        bytes bytes = 15;
    }
}
